<figure class="product-figure">
    <div class="product-image">
        <img src="{{ url_for('static', filename=laptop.image_path) }}"
             alt="{{ laptop.image_alt }}" width="{{ laptop.image_width }}" height="{{ laptop.image_height }}"
             style="max-width:{{ laptop.image_width }}px;max-height:{{ laptop.image_height }}px"
             loading="lazy" decoding="async" data-product-image
             data-product-name="{{ laptop.name }}"
             data-fallback="{{ url_for('static', filename='images/laptop-placeholder.svg') }}">
        {% if not laptop.has_image %}<span class="image-caption">Chưa có ảnh</span>{% endif %}
    </div>
    {% if laptop.has_image %}
    <figcaption class="image-credit">
        Ảnh sản phẩm: <a href="{{ laptop.image_source_url }}" target="_blank" rel="noopener noreferrer">{{ laptop.image_author }}</a>
        {% if laptop.image_representative %}<span title="Ảnh của {{ laptop.image_source_model }}">Ảnh đại diện cùng dòng</span>{% endif %}
        {% if laptop.image_license and laptop.image_license_url %} · <a href="{{ laptop.image_license_url }}" target="_blank" rel="noopener noreferrer">{{ laptop.image_license }}</a>{% endif %}
    </figcaption>
    {% else %}
    <figcaption class="image-credit image-missing"><details><summary>Tình trạng ảnh</summary><p>{{ laptop.image_note }}</p>{% if laptop.image_source_url %}<a href="{{ laptop.image_source_url }}" target="_blank" rel="noopener noreferrer">Trang nguồn đã kiểm tra ↗</a>{% endif %}</details></figcaption>
    {% endif %}
</figure>
